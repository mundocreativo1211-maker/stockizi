<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stockizi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Stockizi</h1>
      <p>La aplicación de escritorio está funcionando.</p>
      <p>El próximo paso será crear la primera pantalla de productos.</p>
      <form id="product-form">
        <label for="product-name">Nombre</label>
        <input id="product-name" type="text" required />
        <label for="product-price">Precio</label>
        <input id="product-price" type="number" min="0" step="0.01" required />

        <label for="product-stock">Stock</label>
        <input id="product-stock" type="number" min="0" step="0.001" required />

        <label for="product-unit">Unidad de medida</label>
        <select id="product-unit" required>
          <option value="UNIT">Unidad</option>
          <option value="KILOGRAM">Kilogramo</option>
          <option value="METER">Metro</option>
          <option value="LITER">Litro</option>
        </select>

        <button type="submit">Agregar producto</button>
      </form>

      <ul id="products-list"></ul>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
